<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>운영자 — 뉴저지제일한인교회</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="top">
    <div><strong>뉴저지제일한인교회</strong><span>운영자</span></div>
    <div>
      <span class="who" id="who"></span>
      <button class="btn ghost" id="logoutBtn" type="button" hidden>로그아웃</button>
      <a class="btn ghost" href="../">사이트 보기</a>
    </div>
  </header>

  <main class="wrap">
    <section id="setupPanel" class="card hidden">
      <h1>연결 설정</h1>
      <p class="lede">Supabase URL과 anon 키를 넣으면 이 브라우저에만 저장됩니다. 공개 사이트는 Vercel 환경 변수 또는 <code>js/supabase-config.js</code>가 필요합니다.</p>
      <label>Supabase URL</label>
      <input id="setupUrl" placeholder="https://xxxx.supabase.co">
      <label>anon public key</label>
      <textarea id="setupKey" placeholder="eyJ..."></textarea>
      <div class="btn-row">
        <button class="btn" id="saveSetup" type="button">저장하고 계속</button>
      </div>
      <p class="err" id="setupErr"></p>
    </section>

    <section id="loginPanel" class="card hidden">
      <h1>운영자 로그인</h1>
      <p class="lede">설교, 소식, 주보를 수정하려면 로그인하세요. 첫 계정은 Supabase Authentication에서 만든 뒤, SQL을 실행하면 자동으로 운영자가 됩니다.</p>
      <label>이메일</label>
      <input id="email" type="email" autocomplete="username">
      <label>비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="btn-row">
        <button class="btn" id="loginBtn" type="button">로그인</button>
      </div>
      <p class="err" id="loginErr"></p>
    </section>

    <section id="appPanel" class="hidden">
      <h1>콘텐츠 관리</h1>
      <p class="lede">변경 사항은 저장 즉시 홈페이지에 반영됩니다.</p>
      <div class="tabs">
        <button type="button" data-tab="sermons" class="on">주일설교</button>
        <button type="button" data-tab="news">이번 주 소식</button>
        <button type="button" data-tab="bulletins">주보</button>
      </div>
      <p class="ok" id="flash"></p>

      <div id="tab-sermons" class="card">
        <form id="sermonForm">
          <input type="hidden" name="id">
          <div class="row2">
            <div>
              <label>제목</label>
              <input name="title" required>
            </div>
            <div>
              <label>영문 제목</label>
              <input name="title_en">
            </div>
          </div>
          <div class="row2">
            <div>
              <label>본문</label>
              <input name="scripture" placeholder="요한복음 5:31-47">
            </div>
            <div>
              <label>영문 본문</label>
              <input name="scripture_en" placeholder="John 5:31-47">
            </div>
          </div>
          <div class="row2">
            <div>
              <label>설교자</label>
              <input name="preacher" placeholder="강상석 담임목사">
            </div>
            <div>
              <label>날짜</label>
              <input name="sermon_date" type="date" required>
            </div>
          </div>
          <label>YouTube 주소 또는 ID</label>
          <input name="youtube_id" placeholder="https://www.youtube.com/watch?v=...">
          <div class="btn-row">
            <button class="btn" type="submit">저장</button>
            <button class="btn ghost" type="reset">새로 작성</button>
          </div>
        </form>
        <div id="sermonList"></div>
      </div>

      <div id="tab-news" class="card hidden">
        <form id="newsForm">
          <input type="hidden" name="id">
          <label>제목</label>
          <input name="title" required>
          <label>영문</label>
          <input name="title_en">
          <div class="row2">
            <div>
              <label>표시 날짜</label>
              <input name="date_label" placeholder="06.07 또는 매주 일요일" required>
            </div>
            <div>
              <label>정렬용 날짜 (선택)</label>
              <input name="sort_date" type="date">
            </div>
          </div>
          <div class="btn-row">
            <button class="btn" type="submit">저장</button>
            <button class="btn ghost" type="reset">새로 작성</button>
          </div>
        </form>
        <div id="newsList"></div>
      </div>

      <div id="tab-bulletins" class="card hidden">
        <form id="bulletinForm">
          <input type="hidden" name="id">
          <label>제목</label>
          <input name="title" required placeholder="2026년 6월 14일 주보">
          <div class="row2">
            <div>
              <label>날짜</label>
              <input name="bulletin_date" type="date" required>
            </div>
            <div>
              <label>PDF 링크</label>
              <input name="url" placeholder="https://...">
            </div>
          </div>
          <div class="btn-row">
            <button class="btn" type="submit">저장</button>
            <button class="btn ghost" type="reset">새로 작성</button>
          </div>
        </form>
        <div id="bulletinList"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/db.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
